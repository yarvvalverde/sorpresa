<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para usted 🧡💙</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at top, #17345f, #07111f 62%, #03070d);
    color: white;
    overflow-x: hidden;
  }
  .screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    position: relative;
  }
  #intro { transition: opacity .8s ease, transform .8s ease; }
  .card {
    width: min(92vw, 430px);
    padding: 36px 24px;
    border-radius: 28px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    backdrop-filter: blur(12px);
  }
  .tiny { opacity: .8; letter-spacing: .08em; font-size: .8rem; text-transform: uppercase; }
  h1 { margin: 12px 0 8px; font-size: clamp(2rem, 8vw, 3.3rem); }
  p { line-height: 1.55; }
  button {
    margin-top: 20px;
    border: 0;
    border-radius: 999px;
    padding: 15px 24px;
    font-size: 1rem;
    font-weight: 700;
    color: #07111f;
    background: linear-gradient(90deg, #ff8a1f, #ffb15f);
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,138,31,.3);
  }
  button:active { transform: scale(.98); }
  #surprise {
    display: none;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s ease, transform 1s ease;
  }
  #surprise.show { opacity: 1; transform: translateY(0); }
  .bouquet {
    width: min(92vw, 520px);
    border-radius: 28px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
  }
  .message {
    width: min(92vw, 520px);
    margin: 20px auto 0;
    padding: 22px;
    border-radius: 24px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.13);
  }
  .orange { color: #ff963b; }
  .blue { color: #6eb6ff; }
  .heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: floatUp linear forwards;
    opacity: .85;
    z-index: 5;
  }
  @keyframes floatUp {
    to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }
  .cars { font-size: 1.6rem; letter-spacing: .35rem; margin-top: 12px; }
</style>
</head>
<body>

<section id="intro" class="screen">
  <div class="card">
    <div class="tiny">Una pequeña sorpresa</div>
    <h1>Para usted 🧡💙</h1>
    <p>No es una página cualquiera.<br>Hay algo aquí que quería darle.</p>
    <button onclick="openSurprise()">Abrir sorpresa ✨</button>
  </div>
</section>

<section id="surprise" class="screen">
  <div>
    <img class="bouquet" src="ramo.png" alt="Ramo naranja y azul con temática de carros">
    <div class="message">
      <div class="tiny">Para mi persona favorita</div>
      <h2><span class="orange">Feliz día del novio</span><br>
      <span class="blue">y de los Hot Wheels</span> 🏎️</h2>
      <p>Un detallito diferente para recordarle cuánto lo quiero. 🧡💙</p>
      <div class="cars">🏎️ 💨 🏁</div>
    </div>
  </div>
</section>

<script>
function openSurprise() {
  const intro = document.getElementById("intro");
  const surprise = document.getElementById("surprise");
  intro.style.opacity = "0";
  intro.style.transform = "scale(.96)";
  setTimeout(() => {
    intro.style.display = "none";
    surprise.style.display = "grid";
    requestAnimationFrame(() => surprise.classList.add("show"));
    hearts();
  }, 700);
}
function hearts() {
  const symbols = ["🧡","💙","✨","🏎️"];
  for (let i=0; i<28; i++) {
    setTimeout(() => {
      const e = document.createElement("div");
      e.className = "heart";
      e.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      e.style.left = Math.random()*95 + "vw";
      e.style.fontSize = (18 + Math.random()*18) + "px";
      e.style.animationDuration = (4 + Math.random()*4) + "s";
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 8500);
    }, i*130);
  }
}
</script>
</body>
</html>
